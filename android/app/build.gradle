plugins {
    id 'com.android.application'
}
android {
    namespace 'com.alexei.chessqueens'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alexei.chessqueens'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-qa'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
